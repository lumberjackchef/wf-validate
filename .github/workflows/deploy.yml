name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel in-flight deploys

env:
  REGISTRY: registry.digitalocean.com
  # Loaded from Infisical ci env by the load-infisical step (JAR-749);
  # not a workflow-level secrets reference (those are evaluated before
  # steps run, so the value must be read at step time).
  IMAGE_TAG: ${{ github.sha }}
  # Only the commit-SHA tag is pushed; `latest` was removed with .do/app.yaml
  # (JAR-471) since no consumer references a mutable tag.
  # JAR-1245: single source for the observability file list. It is needed in
  # THREE places (sync-step backup loop, sync-step scp list, rollback restore
  # loop); before this variable each copy was hand-maintained and drift was
  # silent (backup lists a file the ship list omits => rollback no-ops).
  # The sync-parity guard (TestObservabilityConfigsSyncedInDeploy) pins every
  # list against podman-compose.yml's derived mount set.
  OBS_CONFIG_FILES: "loki-config.yml alloy-config.alloy grafana-datasources.yml prometheus.yml prometheus-rules.yml tempo.yml grafana-dashboards.yml dashboards-red.json dashboards-kpis.json grafana-alerting.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Docker Images
    runs-on: spare
    # 25, not 15. Each matrix leg now does build + push + a full Trivy scan; on
    # a vulnerability-DB cache miss that adds a database download, a pull of the
    # just-pushed image, and a scan of every layer. A timeout here fails the
    # DEPLOY for a reason unrelated to the deploy (JAR-991).
    timeout-minutes: 25
    strategy:
      matrix:
        # All six images come from the single deployments/Dockerfile, selected
        # by the SERVICE build arg. The context is the REPO ROOT: that Dockerfile
        # COPYs go.mod/go.sum and services/, shared/, proto/ from the root, so a
        # services/<name> context fails at the first COPY.
        service:
          - name: trip-core
            port: 8080
          - name: user-auth
            port: 50051
          - name: external-data
            port: 50052
          - name: ml
            port: 50053
          - name: analytics
            port: 50054
          - name: ai
            port: 8081
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load Infisical ci secrets
        uses: ./.github/actions/load-infisical
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          path: /core
          required-keys: DIGITALOCEAN_ACCESS_TOKEN REGISTRY_NAME

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DigitalOcean Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.DIGITALOCEAN_ACCESS_TOKEN }}
          password: ${{ env.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deployments/Dockerfile
          build-args: |
            SERVICE=${{ matrix.service.name }}
            PORT=${{ matrix.service.port }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NAME }}/${{ matrix.service.name }}:${{ env.IMAGE_TAG }}
          cache-from: type=local,src=/tmp/.buildx-cache/${{ matrix.service.name }}
          cache-to: type=local,dest=/tmp/.buildx-cache/${{ matrix.service.name }},mode=max

      # Trivy in this job's own temp dir. The spare host's runner instances
      # share $HOME, and a scan that ran the binary while another job was still
      # installing it there failed with "Text file busy" (JAR-1967).
      - name: Install Trivy for this job
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0
          cache: true
          path: ${{ runner.temp }}/trivy

      # The image that actually runs in production, scanned (JAR-769, core#459
      # review MEDIUM 1). CI scans a `:ci` proxy build at PR time; this is a
      # SEPARATE build from a separate workflow, so until now the exact
      # artifacts that reach the droplets were scanned nowhere.
      #
      # After the push rather than before it, and the trade is worth stating.
      # A failure here leaves the image sitting in the registry unreferenced —
      # but `deploy` is `needs: build`, so a failing scan means it is never
      # deployed, and the registry is not production. Gating BEFORE the push
      # would mean building twice (load, scan, then push), and I cannot measure
      # whether the second build is a cache hit on this runner, so it could
      # silently double every deploy.
      #
      # Same gate as CI, deliberately: severity, ignore-unfixed and exit-code
      # all match, so a PR that went green cannot fail here for a different
      # reason and confuse whoever is watching the deploy.
      - name: Scan the ${{ matrix.service.name }} image that will be deployed
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # trivy-action is composite: trivy runs on the runner and picks up
          # the docker login above via ~/.docker/config.json. State that
          # dependency explicitly instead of leaning on runner HOME, so a
          # future trivy-action version that runs in a container fails loudly
          # at review time rather than 401-ing every deploy.
          TRIVY_USERNAME: ${{ env.DIGITALOCEAN_ACCESS_TOKEN }}
          TRIVY_PASSWORD: ${{ env.DIGITALOCEAN_ACCESS_TOKEN }}
        with:
          skip-setup-trivy: true
          image-ref: ${{ env.REGISTRY }}/${{ env.REGISTRY_NAME }}/${{ matrix.service.name }}:${{ env.IMAGE_TAG }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: '1'

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: spare
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load Infisical ci secrets
        uses: ./.github/actions/load-infisical
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          path: /core
          required-keys: DROPLET_HOST DROPLET_HOST_2 DROPLET_HOST_KEY DROPLET_HOST_KEY_2 DEPLOY_USER DROPLET_SSH_KEY

      # JAR-768: the deploy tree follows the deploy user, so the cutover to a
      # non-root account is a SECRET change and not a workflow change.
      #
      # `root` resolves to /root/jarvis — byte-identical to the path that was
      # hardcoded here — so this step is a no-op until someone deliberately
      # changes DEPLOY_USER. Rolling back is setting it to `root` again; there
      # is no revert to land and no window where the two disagree.
      - name: Resolve the deploy tree for this user
        env:
          DEPLOY_USER: ${{ env.DEPLOY_USER }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_USER" = "root" ]; then
            PROD_DIR=/root/jarvis
          else
            PROD_DIR="/home/$DEPLOY_USER/jarvis"
          fi
          echo "PROD_DIR=$PROD_DIR" >> "$GITHUB_ENV"

      - name: Sync compose + CA cert to both serving droplets
        # JAR-756: prod's compose file was stale (hardcoded :latest, pre
        # JAR-471) and the deploy never updated it — deploys silently
        # no-op'd since JAR-471 removed :latest from the registry. The repo
        # is the source of truth: ship podman-compose.yml + the DO PG CA
        # cert (verify-full DB TLS) before the deploy runs. Fail-closed:
        # a failed sync aborts before any podman change.
        # JAR-2563: synced to BOTH serving droplets (prod + prod-2) — the
        # sync/ship/assert scripts the deploy runs must exist on every host
        # the rolling deploy touches, or the second pass runs stale guards.
        env:
          DROPLET_HOST: ${{ env.DROPLET_HOST }}
          DROPLET_HOST_2: ${{ env.DROPLET_HOST_2 }}
          DEPLOY_USER: ${{ env.DEPLOY_USER }}
          DROPLET_SSH_KEY: ${{ env.DROPLET_SSH_KEY }}
          PROD_DIR: ${{ env.PROD_DIR }}
          # JAR-1245 review: declare the dependency explicitly (like the
          # other forwarded vars) instead of relying on workflow-level env
          # resolution inside the run script.
          OBS_CONFIG_FILES: ${{ env.OBS_CONFIG_FILES }}
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/prod-ssh-key' EXIT
          install -m 600 /dev/null /tmp/prod-ssh-key
          printf '%s\n' "$DROPLET_SSH_KEY" > /tmp/prod-ssh-key
          for HOST in "$DROPLET_HOST" "$DROPLET_HOST_2"; do
          # Back up the host's current compose before overwriting, so the
          # rollback path can restore the config that is actually running
          # (JAR-756 review finding 2).
          ssh -i /tmp/prod-ssh-key -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$HOST" \
            "cp $PROD_DIR/podman-compose.yml $PROD_DIR/podman-compose.yml.previous 2>/dev/null || true"
          scp -i /tmp/prod-ssh-key -o StrictHostKeyChecking=accept-new \
            deployments/podman-compose.yml \
            "$DEPLOY_USER@$HOST:$PROD_DIR/podman-compose.yml"
          # The pin assertion runs FROM this tree on the remote host, so the
          # script must ship with the compose it validates — one code path,
          # tested in CI by deployments/liveness_sync_test.go against the
          # same file.
          scp -i /tmp/prod-ssh-key -o StrictHostKeyChecking=accept-new \
            deployments/assert-liveness-pins.sh \
            "$DEPLOY_USER@$HOST:$PROD_DIR/assert-liveness-pins.sh"
          # Same rule as the pin assertion: the guard runs FROM the remote tree,
          # so it must ship with the compose it checks. Tested in CI by
          # deployments/test-assert-env-passthrough.sh against this same file.
          scp -i /tmp/prod-ssh-key -o StrictHostKeyChecking=accept-new \
            deployments/assert-env-passthrough.sh \
            "$DEPLOY_USER@$HOST:$PROD_DIR/assert-env-passthrough.sh"
          # JAR-1326: the deploy-time network boundary gate ships with the
          # compose it protects, same one-code-path contract as
          # assert-liveness-pins.sh above — the scanner the deploy runs is
          # the scanner CI tests (deployments/assert_external_binds_test.go).
          scp -i /tmp/prod-ssh-key -o StrictHostKeyChecking=accept-new \
            deployments/assert-external-binds.sh \
            "$DEPLOY_USER@$HOST:$PROD_DIR/assert-external-binds.sh"
          # JAR-590: the deploy remote script ships as a tracked file — the
          # inline version grew past GitHub's 21000-char expression cap and
          # startup-failed every run with zero jobs.
          scp -i /tmp/prod-ssh-key -o StrictHostKeyChecking=accept-new \
            deployments/deploy-remote.sh \
            "$DEPLOY_USER@$HOST:$PROD_DIR/deploy-remote.sh"
          # JAR-458: podman-compose.yml's observability services bind-mount
          # ./observability/* relative to the compose file. The configs must
          # ship with it: podman creates EMPTY DIRECTORIES at missing bind
          # sources, and loki/alloy/grafana would crash-loop on missing
          # configs on the next deploy. Each config is backed up to
          # <name>.previous before overwrite, same fail-closed convention as
          # the compose backup above, so the rollback path can restore the
          # exact configs the running containers were started with. mkdir
          # first — scp cannot create the remote directory.
          # JAR-1245: the ten observability files are used in THREE places
          # (backup loop here, scp list below, rollback restore loop in the
          # Deploy step). The list is defined ONCE as OBS_CONFIG_FILES at
          # the job env level and all three sites reference it; the
          # sync-parity guard (TestObservabilityConfigsSyncedInDeploy)
          # pins each against compose's derived mount list.
          # JAR-1245: the observability log shipper (jarvis-log-ship user
          # unit) follows `podman logs -f` per app service; the Deploy via
          # SSH step's `podman-compose up -d` RECREATES containers whose
          # image changed, which kills that service's follower and makes
          # the unit exit+respawn (all-or-nothing supervision). To resume
          # shipping from clean followers immediately AFTER the deploy
          # step finishes (this sync step runs BEFORE the recreation, so
          # restarting here would be too early), the deploy's post-reload
          # block on the droplet runs:
          #   systemctl --user restart jarvis-log-ship.service
          # See the "Reload nginx" tail of the Deploy via SSH script.
          ssh -i /tmp/prod-ssh-key -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$HOST" "mkdir -p $PROD_DIR/observability && for f in $OBS_CONFIG_FILES; do if [ -d \"$PROD_DIR/observability/\$f\" ]; then echo \"FATAL: $PROD_DIR/observability/\$f is a directory (podman empty-dir bind edge, JAR-458/1245) - remove it on the host before deploy\" >&2; exit 1; fi; cp $PROD_DIR/observability/\$f $PROD_DIR/observability/\$f.previous 2>/dev/null || true; done"
          scp -i /tmp/prod-ssh-key -o StrictHostKeyChecking=accept-new \
            deployments/observability/loki-config.yml \
            deployments/observability/alloy-config.alloy \
            deployments/observability/grafana-datasources.yml \
            deployments/observability/prometheus.yml \
            deployments/observability/prometheus-rules.yml \
            deployments/observability/tempo.yml \
            deployments/observability/grafana-dashboards.yml \
            deployments/observability/dashboards-red.json \
            deployments/observability/dashboards-kpis.json \
            deployments/observability/grafana-alerting.yml \
            "$DEPLOY_USER@$HOST:$PROD_DIR/observability/"
          # The list above must equal $OBS_CONFIG_FILES; scp takes no stdin
          # list, so it stays spelled out and the sync-parity guard
          # (TestObservabilityConfigsSyncedInDeploy) pins it against the
          # variable and the compose mounts.
          # The cert lands in the deploy tree first, then root installs it.
          # /etc/ssl/certs is not writable by a non-root deploy user, and the
          # container bind-mounts that host path (podman-compose.yml), so the
          # destination cannot move. `sudo install` is the one hop across, and
          # the sudoers entry provisioned by deployments/setup-deploy-user.sh
          # pins BOTH paths so it cannot write that cert from anywhere else.
          #
          # Root takes the same route rather than a shortcut: one code path
          # means the privileged branch is the one that gets exercised on every
          # deploy, instead of first running on the day of the cutover.
          scp -i /tmp/prod-ssh-key -o StrictHostKeyChecking=accept-new \
            deployments/do-pg-ca.crt \
            "$DEPLOY_USER@$HOST:$PROD_DIR/do-pg-ca.crt"
          # The cert lands in the deploy tree first, then root installs it
          # per host (same one-code-path reasoning as above).
          ssh -i /tmp/prod-ssh-key -o StrictHostKeyChecking=accept-new \
            "$DEPLOY_USER@$HOST" \
            "sudo install -o root -g root -m 644 $PROD_DIR/do-pg-ca.crt /etc/ssl/certs/do-pg-ca.crt"
          done

      - name: Ship nginx site config (repo is source of truth)
        # JAR-1055: deploy.yml previously never shipped an nginx config at all
        # (only comments and `sudo nginx -s reload`), so CSP and security-header
        # changes in infra/nginx/sites-jarvistravel.conf (JAR-798 Plaid,
        # JAR-944 headers) never reached /etc/nginx. Mirror the JAR-756
        # compose-sync pattern: back up the live config, ship the repo file,
        # and validate with the real parser BEFORE any podman change.
        # `nginx -t` failure restores the previous config and aborts; nginx is
        # only reloaded later, after health checks, so a broken file can never
        # be served.
        # JAR-2563: shipped to BOTH serving droplets; each host's key pin is
        # verified inside the loop (DROPLET_HOST_KEY / DROPLET_HOST_KEY_2).
        env:
          DROPLET_HOST: ${{ env.DROPLET_HOST }}
          DROPLET_HOST_2: ${{ env.DROPLET_HOST_2 }}
          DEPLOY_USER: ${{ env.DEPLOY_USER }}
          DROPLET_SSH_KEY: ${{ env.DROPLET_SSH_KEY }}
          PROD_DIR: ${{ env.PROD_DIR }}
          DROPLET_HOST_KEY: ${{ env.DROPLET_HOST_KEY }}
          DROPLET_HOST_KEY_2: ${{ env.DROPLET_HOST_KEY_2 }}
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/prod-ssh-key /tmp/prod-known-hosts' EXIT HUP INT TERM
          install -m 600 /dev/null /tmp/prod-ssh-key
          printf '%s\n' "$DROPLET_SSH_KEY" > /tmp/prod-ssh-key
          ship_one() {
            HOST="$1"; HOST_KEY="$2"
          # Host-key pinning (JAR-1055 review finding): when DROPLET_HOST_KEY
          # (SHA256 fingerprint of the droplet's ED25519 host key, from
          # `ssh-keyscan -t ed25519 -H <host> | ssh-keygen -lf -`) is set,
          # verify it before the first connection; otherwise fall back to
          # accept-new, matching the JAR-756 sibling step. Optional on
          # purpose: external keys never gate deploys.
          # JAR-1324: the scan is restricted to ED25519. An unfiltered
          # ssh-keyscan returns the host's three host keys (ECDSA, ED25519,
          # RSA) in nondeterministic order, so `head -1` compared the pin
          # against a random key type per run — a deploy coin flip.
          if [ -n "${DROPLET_HOST_KEY:-}" ]; then
            ssh-keyscan -t ed25519 -H "$HOST" > /tmp/prod-known-hosts 2>/dev/null
            fp="$(ssh-keygen -lf /tmp/prod-known-hosts | awk '{print $2}' | head -1)"
            if [ "$fp" != "$HOST_KEY" ]; then
              echo "FATAL: droplet host key mismatch (expected $HOST_KEY, got $fp)" >&2
              exit 1
            fi
            SSHRC=(-o "UserKnownHostsFile=/tmp/prod-known-hosts" -o "StrictHostKeyChecking=yes")
          else
            SSHRC=(-o StrictHostKeyChecking=accept-new)
          fi
          # Back up the live config — mandatory and fail-closed. A missing
          # live file or a sudo denial aborts BEFORE anything is touched:
          # .previous must always mirror what nginx is actually serving, or
          # the restore path below cannot be trusted.
          ssh -i /tmp/prod-ssh-key "${SSHRC[@]}" \
            "$DEPLOY_USER@$HOST" \
            "sudo -n cp /etc/nginx/sites-available/jarvistravel /etc/nginx/sites-available/jarvistravel.previous || { echo 'FATAL: could not back up the live nginx config' >&2; exit 1; }"
          # Keep this filename in sync with the pinned sudoers install entry in
          # deployments/setup-deploy-user.sh (both must name the same file, or
          # the install silently stops matching at the non-root cutover).
          scp -i /tmp/prod-ssh-key "${SSHRC[@]}" \
            infra/nginx/sites-jarvistravel.conf \
            "$DEPLOY_USER@$HOST:$PROD_DIR/sites-jarvistravel.conf"
          # Install + validate with the real parser (sudo -n fails fast and
          # loudly when a sudoers entry is missing). On failure, restore the
          # previous file and abort — nginx keeps serving the old config from
          # memory (nothing has been reloaded yet), so the box is left as found.
          ssh -i /tmp/prod-ssh-key "${SSHRC[@]}" \
            "$DEPLOY_USER@$HOST" \
            "if sudo -n install -o root -g root -m 644 \"$PROD_DIR/sites-jarvistravel.conf\" /etc/nginx/sites-available/jarvistravel; then sudo -n nginx -t || { sudo -n cp /etc/nginx/sites-available/jarvistravel.previous /etc/nginx/sites-available/jarvistravel && echo 'nginx -t failed - previous config restored' >&2 || echo 'FATAL: config rejected AND restore failed - jarvistravel on disk is broken (old config still served from memory)' >&2; exit 1; }; else echo 'FATAL: install of the nginx site config failed' >&2; exit 1; fi"
          }
          ship_one "$DROPLET_HOST" "${DROPLET_HOST_KEY:-}"
          ship_one "$DROPLET_HOST_2" "${DROPLET_HOST_KEY_2:-}"


      - name: Verify the served nginx config is the shipped one
        # JAR-1055 review finding: `nginx -t` validates the installed FILE but
        # proves nothing about what nginx SERVES after the reload — a rebound
        # sites-enabled symlink or a leftover conf.d server block would reload
        # a different config with a green deploy, which is exactly the state
        # the host is in today (effective config carries no Plaid marker).
        # Assert the shipped file's unique marker in the live effective config
        # and hit the API THROUGH nginx. Fail the deploy on mismatch. Runs
        # after the reload (Deploy via SSH step) so it observes the live state.
        # JAR-2563: verified on BOTH serving droplets.
        env:
          DROPLET_HOST: ${{ env.DROPLET_HOST }}
          DROPLET_HOST_2: ${{ env.DROPLET_HOST_2 }}
          DEPLOY_USER: ${{ env.DEPLOY_USER }}
          DROPLET_SSH_KEY: ${{ env.DROPLET_SSH_KEY }}
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/prod-ssh-key' EXIT HUP INT TERM
          install -m 600 /dev/null /tmp/prod-ssh-key
          printf '%s\n' "$DROPLET_SSH_KEY" > /tmp/prod-ssh-key
          for HOST in "$DROPLET_HOST" "$DROPLET_HOST_2"; do
            echo "=== Verify served config on $HOST ==="
            ssh -i /tmp/prod-ssh-key -o StrictHostKeyChecking=accept-new \
              "$DEPLOY_USER@$HOST" \
              "sudo -n nginx -Tq | grep -q 'cdn.plaid.com' && curl -sf --resolve api.jarvistravel.com:443:127.0.0.1 https://api.jarvistravel.com/v1/health >/dev/null || { echo 'FATAL: served nginx config lacks the shipped Plaid marker, or the API is unreachable through nginx' >&2; exit 1; }"
          done

      # NOTE (JAR-375): deploy as a non-root user. The droplet must have a
      # `deploy` user with rootless podman configured, membership in the docker
      # group, and a sudoers NOPASSWD entry limited to `nginx -s reload`,
      # `nginx -t`, `nginx -Tq`, and the pinned install/cp paths provisioned by
      # deployments/setup-deploy-user.sh (JAR-1055 adds the nginx site-config
      # ship, served-config verify, and validate commands).
      #
      # Third-party actions are pinned by commit SHA (JAR-470): this job holds
      # registry-push and production-SSH credentials, so a re-pointed upstream
      # tag would execute attacker code with them. The trailing `# vN` comment
      # is the human-readable version only — bump the SHA, not the comment,
      # when upgrading.
      - name: Deploy via SSH (rolling — prod-2 first, then prod)
        # JAR-2563: rolling deploy across both serving droplets. host list is
        # ORDERED prod-2 first, then prod, and sync: true makes drone-ssh run
        # them SEQUENTIALLY with fail-fast (verified in drone-ssh v1.8.2
        # plugin.go: sync mode iterates hosts in order; the first host whose
        # script exits non-zero sends to errChannel and Exec() returns before
        # the next host starts). Consequence: a prod-2 failure aborts the job
        # BEFORE prod is touched — prod keeps serving the previous release and
        # the LB (health check 3x10s) drains prod-2 while it rolls back.
        # Each host's script exits non-zero on its own health/rollback
        # failure (set -e + explicit exit 1 paths below), so a rolled-back
        # prod-2 still fails the deploy red instead of shipping half a
        # release silently.
        # NOTE: DEPLOY_SERVICES/LIVE_ENDPOINTS guards and rollback logic are
        # host-local and identical on both hosts (same compose, same image
        # set); the LB health check (HTTPS /v1/health, 3x10s) is the traffic
        # gate while a host is down, proven by the JAR-2563 failover test.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          DEPLOY_SHA: ${{ env.IMAGE_TAG }}
          REGISTRY: ${{ env.REGISTRY }}
          REGISTRY_NAME: ${{ env.REGISTRY_NAME }}
          # JAR-1245 review round 15: explicit step-level forward so the
          # rollback restore loop never depends on workflow-level env
          # resolution (same pattern as the sync step's env block).
          OBS_CONFIG_FILES: ${{ env.OBS_CONFIG_FILES }}
          # JAR-1326: the boundary allowlist, defined ONCE here and synced
          # against the DO cloud firewall on jarvis-prod (inbound tcp/22
          # from the deploy+admin sources, tcp/80+443 public, icmp). The
          # gate below fails any rollout that leaves a non-loopback
          # listener outside this list — adding a port here is a
          # DELIBERATE production exposure decision and must ship with the
          # matching firewall rule.
          # JAR-590: 9090-9095 are prod-2's metrics listeners, bound to its VPC
          # address for cross-host scraping — non-loopback, so they must be
          # allowlisted here or the boundary gate rolls every prod-2 deploy
          # back. WHO can reach them is the cloud firewall's job: prod-2's
          # boundary admits tcp/9090-9095 ONLY from prod's VPC /32 (applied
          # out-of-band with this change). Prod's own boundary has no such
          # rule, so the ports stay closed there despite the shared allowlist.
          BOUNDARY_ALLOW_PORTS: "22,80,443,9090-9095"
          # JAR-1326 (round-21 review): the six-service list, defined ONCE
          # here — the rollback staging loop, pull loop, rollback function,
          # and :deployed tagging loop all iterate $DEPLOY_SERVICES so the
          # four copies cannot drift when a service is added.
          # Keep in lock-step with LIVE_ENDPOINTS below (same service set):
          # a service in one but not the other is either unrolled-back or
          # unhealth-checked. liveness_sync_test.go pins
          # LIVE_ENDPOINTS <-> compose.
          DEPLOY_SERVICES: "trip-core user-auth external-data ml analytics ai"
        with:
          host: "${{ env.DROPLET_HOST_2 }},${{ env.DROPLET_HOST }}"
          sync: true
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.DROPLET_SSH_KEY }}
          # envs: forwards the named variable into the remote shell. Without
          # this the script block runs with a bare environment and $PROD_DIR
          # would expand to nothing — `cd ` succeeds in some shells, so the
          # failure would land later and somewhere unrelated.
          envs: PROD_DIR,DEPLOY_SHA,REGISTRY,REGISTRY_NAME,OBS_CONFIG_FILES,BOUNDARY_ALLOW_PORTS,DEPLOY_SERVICES
          script: |
            set -e
            cd "$PROD_DIR"
            bash "$PROD_DIR/deploy-remote.sh"
